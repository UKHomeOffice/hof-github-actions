name: Sync hof-nodejs image in .drone.yml and package.json

on:
  workflow_call:
    secrets:
      app-id:
        required: true
      private-key:
        required: true

permissions: {}

jobs:
  sync:
    # Runs in the caller's pull_request_target context; PR code is only read, never executed.
    if: >-
      github.event_name == 'pull_request_target' &&
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Callers must grant at least contents: read to the calling job.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Read hof-nodejs image from Dockerfile
        id: image
        run: |
          image=$(grep -m1 -oE 'quay\.io/ukhomeofficedigital/hof-nodejs:[^[:space:]]+' Dockerfile)
          if ! echo "$image" | grep -qE '^quay\.io/ukhomeofficedigital/hof-nodejs:[0-9]+\.[0-9]+\.[0-9]+[A-Za-z0-9._-]*@sha256:[a-f0-9]{64}$'; then
            echo "Unexpected hof-nodejs image reference in Dockerfile: '$image'"
            exit 1
          fi
          # e.g. hof-nodejs:24.22.2_3-alpine@sha256:... -> 24.22.2
          version=$(echo "$image" | sed -E 's|^[^:]+:([0-9]+\.[0-9]+\.[0-9]+).*$|\1|')
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Update .drone.yml
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          sed -i -E "s|^(node_image_name: &node_image_name ).*$|\1${IMAGE}|" .drone.yml
          grep -qF "node_image_name: &node_image_name ${IMAGE}" .drone.yml
          # Covers e2e steps (including commented-out ones) that install node via `n <version>`.
          sed -i -E "s/^([[:space:]]*(#[[:space:]]*)?- n )[0-9]+\.[0-9]+\.[0-9]+[[:space:]]*$/\1${VERSION}/" .drone.yml

      - name: Update package.json engines.node
        env:
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          if [ ! -f package.json ] || ! jq -e '.engines.node' package.json > /dev/null; then
            echo "No engines.node in package.json, skipping"
            exit 0
          fi
          range=">=${VERSION} <$(( ${VERSION%%.*} + 1 )).0.0"
          sed -i -E "/\"engines\"[[:space:]]*:/,/}/ s|(\"node\"[[:space:]]*:[[:space:]]*\")[^\"]*(\")|\1${range}\2|" package.json
          jq -e --arg range "$range" '.engines.node == $range' package.json > /dev/null

      - name: Check for changes
        id: changes
        run: |
          files=$(git diff --name-only -- .drone.yml package.json | tr '\n' ' ')
          if [ -z "$files" ]; then
            echo "Files already up to date"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "files=$files" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate GitHub App token
        id: app-token
        if: steps.changes.outputs.changed == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.private-key }}
          permission-contents: write

      # createCommitOnBranch commits are signed by GitHub, so they show as Verified.
      - name: Create signed commit
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FILES: ${{ steps.changes.outputs.files }}
        run: |
          additions=$(for f in $FILES; do
            jq -n --arg path "$f" --arg contents "$(base64 -w0 "$f")" '{path: $path, contents: $contents}'
          done | jq -s .)
          jq -n \
            --arg repo "$REPOSITORY" \
            --arg branch "$BRANCH" \
            --arg head "$HEAD_SHA" \
            --argjson additions "$additions" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { url } } }",
              variables: {
                input: {
                  branch: { repositoryNameWithOwner: $repo, branchName: $branch },
                  expectedHeadOid: $head,
                  message: { headline: "deps: sync hof-nodejs image and node version" },
                  fileChanges: { additions: $additions }
                }
              }
            }' | gh api graphql --input -
